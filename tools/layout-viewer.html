<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Keybinds - Layout Viewer</title>
<style>
  :root { color-scheme: dark; }
  body { background:#14171c; color:#d7dde5; font:14px/1.4 system-ui, sans-serif; margin:0; padding:16px; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
  .ver { color:#8fa0b3; font-size:12px; }
  .file-btn { background:#1e242c; color:#d7dde5; border:1px solid #39424e; border-radius:6px; padding:6px 10px; cursor:pointer; }
  .file-btn:hover { background:#262e38; }
  #info { color:#8fa0b3; font-size:12px; }
  #info.err { color:#ff7b72; }
  #drop { border:2px dashed #39424e; border-radius:8px; padding:40px; text-align:center; color:#8fa0b3; margin-bottom:12px; }
  body.drag #drop { border-color:#3b82f6; color:#60a5fa; background:#16202c; }
  #kb { overflow-x:auto; padding:8px; background:#0e1114; border:1px solid #262d36; border-radius:8px; display:inline-block; }
  #kb:empty { display:none; }
  svg text { fill:#c9d4e0; font:11px ui-monospace, monospace; pointer-events:none; }
  .key { fill:#2e3947; stroke:#55627a; rx:4; cursor:pointer; }
  .key:hover, .key.sel { fill:#3b82f6; stroke:#60a5fa; }
  .key:hover text, .key.sel text { fill:#fff; }
  .key.mod { fill:#2c2a3a; stroke:#4a4460; }
  .key.mod:hover, .key.mod.sel { fill:#6d5bd0; stroke:#8b7cf0; }
  .key.nav { fill:#1f2d2a; stroke:#355248; }
  .key.nav:hover, .key.nav.sel { fill:#2f9e77; stroke:#4ade9e; }
  #tip { position:fixed; pointer-events:none; background:#000d; border:1px solid #39424e; border-radius:6px;
         padding:6px 9px; font:12px ui-monospace, monospace; display:none; z-index:10; white-space:pre; }
  #bar { margin-top:10px; font:12px ui-monospace, monospace; color:#8fa0b3; min-height:1em; }
</style>
</head>
<body>
<header>
  <strong>Visual Keybinds - layout viewer</strong> <span class="ver">(v3, upload-only)</span>
  <label class="file-btn">load layout JSON<input type="file" id="file" accept=".json,application/json" hidden></label>
  <span id="info">no file loaded - drop a layout JSON here (e.g. ansi_100.json) or use the button</span>
</header>
<div id="drop">drop a physical layout JSON here</div>
<div id="kb"></div>
<div id="bar"></div>
<div id="tip"></div>
<script>
const KEYMAP = {"key.keyboard.escape": [256, "Esc"], "key.keyboard.f1": [290, "F1"], "key.keyboard.f2": [291, "F2"], "key.keyboard.f3": [292, "F3"], "key.keyboard.f4": [293, "F4"], "key.keyboard.f5": [294, "F5"], "key.keyboard.f6": [295, "F6"], "key.keyboard.f7": [296, "F7"], "key.keyboard.f8": [297, "F8"], "key.keyboard.f9": [298, "F9"], "key.keyboard.f10": [299, "F10"], "key.keyboard.f11": [300, "F11"], "key.keyboard.f12": [301, "F12"], "key.keyboard.grave.accent": [96, "`"], "key.keyboard.1": [49, "1"], "key.keyboard.2": [50, "2"], "key.keyboard.3": [51, "3"], "key.keyboard.4": [52, "4"], "key.keyboard.5": [53, "5"], "key.keyboard.6": [54, "6"], "key.keyboard.7": [55, "7"], "key.keyboard.8": [56, "8"], "key.keyboard.9": [57, "9"], "key.keyboard.0": [48, "0"], "key.keyboard.minus": [45, "-"], "key.keyboard.equal": [61, "="], "key.keyboard.backspace": [259, "Backspace"], "key.keyboard.tab": [258, "Tab"], "key.keyboard.a": [65, "A"], "key.keyboard.b": [66, "B"], "key.keyboard.c": [67, "C"], "key.keyboard.d": [68, "D"], "key.keyboard.e": [69, "E"], "key.keyboard.f": [70, "F"], "key.keyboard.g": [71, "G"], "key.keyboard.h": [72, "H"], "key.keyboard.i": [73, "I"], "key.keyboard.j": [74, "J"], "key.keyboard.k": [75, "K"], "key.keyboard.l": [76, "L"], "key.keyboard.m": [77, "M"], "key.keyboard.n": [78, "N"], "key.keyboard.o": [79, "O"], "key.keyboard.p": [80, "P"], "key.keyboard.q": [81, "Q"], "key.keyboard.r": [82, "R"], "key.keyboard.s": [83, "S"], "key.keyboard.t": [84, "T"], "key.keyboard.u": [85, "U"], "key.keyboard.v": [86, "V"], "key.keyboard.w": [87, "W"], "key.keyboard.x": [88, "X"], "key.keyboard.y": [89, "Y"], "key.keyboard.z": [90, "Z"], "key.keyboard.left.bracket": [91, "["], "key.keyboard.right.bracket": [93, "]"], "key.keyboard.backslash": [92, "\\"], "key.keyboard.caps.lock": [280, "Caps Lock"], "key.keyboard.semicolon": [59, ";"], "key.keyboard.apostrophe": [39, "'"], "key.keyboard.enter": [257, "Enter"], "key.keyboard.left.shift": [340, "L Shift"], "key.keyboard.comma": [44, ","], "key.keyboard.period": [46, "."], "key.keyboard.slash": [47, "/"], "key.keyboard.right.shift": [344, "R Shift"], "key.keyboard.left.control": [341, "L Ctrl"], "key.keyboard.left.win": [343, "L Win"], "key.keyboard.left.alt": [342, "L Alt"], "key.keyboard.space": [32, "Space"], "key.keyboard.right.alt": [346, "R Alt"], "key.keyboard.right.win": [347, "R Win"], "key.keyboard.menu": [348, "Menu"], "key.keyboard.right.control": [345, "R Ctrl"], "key.keyboard.print.screen": [283, "PrtSc"], "key.keyboard.scroll.lock": [281, "ScrLk"], "key.keyboard.pause": [284, "Pause"], "key.keyboard.insert": [260, "Ins"], "key.keyboard.home": [268, "Home"], "key.keyboard.page.up": [266, "PgUp"], "key.keyboard.delete": [261, "Del"], "key.keyboard.end": [269, "End"], "key.keyboard.page.down": [267, "PgDn"], "key.keyboard.up": [265, "Up"], "key.keyboard.left": [263, "Left"], "key.keyboard.down": [264, "Down"], "key.keyboard.right": [262, "Right"], "key.keyboard.num.lock": [282, "NumLk"], "key.keyboard.keypad.divide": [331, "Num /"], "key.keyboard.keypad.multiply": [332, "Num *"], "key.keyboard.keypad.subtract": [333, "Num -"], "key.keyboard.keypad.add": [334, "Num +"], "key.keyboard.keypad.enter": [335, "Num Enter"], "key.keyboard.keypad.decimal": [330, "Num ."], "key.keyboard.keypad.0": [320, "Num 0"], "key.keyboard.keypad.1": [321, "Num 1"], "key.keyboard.keypad.2": [322, "Num 2"], "key.keyboard.keypad.3": [323, "Num 3"], "key.keyboard.keypad.4": [324, "Num 4"], "key.keyboard.keypad.5": [325, "Num 5"], "key.keyboard.keypad.6": [326, "Num 6"], "key.keyboard.keypad.7": [327, "Num 7"], "key.keyboard.keypad.8": [328, "Num 8"], "key.keyboard.keypad.9": [329, "Num 9"], "key.keyboard.world.1": [161, "<> (ISO)"], "key.keyboard.international1": [135, "Intl1 (ro)"], "key.keyboard.international2": [136, "Intl2 (kana)"], "key.keyboard.international3": [137, "Intl3 (yen)"], "key.keyboard.international4": [138, "Intl4 (henkan)"], "key.keyboard.international5": [139, "Intl5 (muhenkan)"]};
const U = 46, GAP = 5, PAD = 10;
const MOD = /shift|control|alt|win|menu|space|enter|backspace|tab|caps|escape|^key\.keyboard\.f\d|print|scroll|pause/;
const NAV = /insert|home|page|delete|end|arrow|^key\.keyboard\.(up|down|left|right)$|num\.|keypad/;

const info = document.getElementById('info'), bar = document.getElementById('bar'),
      tip = document.getElementById('tip'), kb = document.getElementById('kb');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function labelOf(id){ const m = KEYMAP[id]; return m ? m[1] : String(id).replace('key.keyboard.',''); }
function codeOf(id){ const m = KEYMAP[id]; return m ? m[0] : '?'; }
function setInfo(t, isErr){ info.textContent = t; info.classList.toggle('err', !!isErr); }

function loadLayout(text, name) {
  let L;
  try { L = JSON.parse(text); }
  catch (e) { setInfo(name + ': invalid JSON - ' + e.message, true); return; }
  if (!L || !Array.isArray(L.keys)) { setInfo(name + ': missing "keys" array', true); return; }
  let bad = 0;
  for (const k of L.keys) {
    if (!k || typeof k.id !== 'string' || typeof k.uX !== 'number' || typeof k.uY !== 'number') bad++;
  }
  const keys = L.keys.filter(k => k && typeof k.id === 'string' && typeof k.uX === 'number' && typeof k.uY === 'number');
  if (!keys.length) { setInfo(name + ': no renderable keys', true); return; }
  const widthU = typeof L.totalWidthU === 'number' ? L.totalWidthU
    : Math.max(...keys.map(k => k.uX + (k.uWidth || 1)));
  const rows = Math.max(...keys.map(k => k.uY + (k.uHeight || 1)));
  render({ keys, totalWidthU: widthU, rows }, name, bad ? ` (${bad} invalid key(s) skipped)` : '');
}

function render(L, name, warn) {
  const W = L.totalWidthU * U + PAD * 2, H = L.rows * U + PAD * 2;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for (const k of L.keys) {
    const kw = k.uWidth || 1, kh = k.uHeight || 1;
    const x = PAD + k.uX * U, y = PAD + k.uY * U, w = kw * U - GAP, h = kh * U - GAP;
    const cls = NAV.test(k.id) ? 'nav' : MOD.test(k.id) ? 'mod' : '';
    let shape;
    if (k.isIsoEnter) {
      const x2 = x + w + GAP, y2 = y + U;
      shape = `<polygon class="key ${cls}" points="${x},${y} ${x2},${y} ${x2},${y+h} ${x - 0.75*U},${y+h} ${x - 0.75*U},${y2} ${x},${y2}" data-id="${esc(k.id)}"/>`;
    } else {
      shape = `<rect class="key ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="4" data-id="${esc(k.id)}"/>`;
    }
    const fs = (w > 70 && h > 30) ? 11 : 9;
    s += shape + `<text x="${x + w/2}" y="${y + h/2 + fs/3}" text-anchor="middle" font-size="${fs}">${esc(labelOf(k.id))}</text>`;
  }
  kb.innerHTML = s + '</svg>';
  const painted = kb.querySelectorAll('.key').length;
  setInfo(`${name}: ${L.keys.length} keys, ${L.totalWidthU}u x ${L.rows}u - painted ${painted}/${L.keys.length}${warn || ''}`, !!warn);
  bar.textContent = '';
  kb.querySelectorAll('.key').forEach(el => {
    el.addEventListener('mousemove', e => {
      const id = el.dataset.id;
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top = (e.clientY + 14) + 'px';
      tip.textContent = `${id}\nGLFW ${codeOf(id)}  -  label: ${labelOf(id)}`;
    });
    el.addEventListener('mouseleave', () => tip.style.display = 'none');
    el.addEventListener('click', () => {
      kb.querySelectorAll('.key.sel').forEach(o => o.classList.remove('sel'));
      el.classList.add('sel');
      const id = el.dataset.id;
      bar.textContent = `selected: ${id}  (GLFW ${codeOf(id)})`;
      if (navigator.clipboard) navigator.clipboard.writeText(id).catch(() => {});
    });
  });
}

document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => loadLayout(r.result, f.name);
  r.readAsText(f);
});

window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
window.addEventListener('dragleave', e => { if (e.target === document.body || e.relatedTarget === null) document.body.classList.remove('drag'); });
window.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => loadLayout(r.result, f.name);
  r.readAsText(f);
});
</script>
</body>
</html>
